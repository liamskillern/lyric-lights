<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0a1a" />
    <meta name="description" content="A live visualizer for whatever you're playing on Spotify, shaped by the album art and the lyrics." />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff2e88'/%3E%3Cstop offset='1' stop-color='%2300d4ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='14' fill='url(%23g)'/%3E%3Cpath d='M9 19h14M11 14h10' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>Lyric Lights</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="stage" aria-label="Music visualizer"></canvas>

    <main id="panel" class="panel" hidden></main>

    <p id="hint" class="hint" hidden></p>

    <div id="hud" class="hud" hidden>
      <div class="now-playing">
        <img id="thumb" alt="" width="56" height="56" />
        <div class="np-text">
          <div id="np-title" class="np-title"></div>
          <div id="np-artist" class="np-artist"></div>
          <div id="np-status" class="np-status"></div>
          <div id="np-time" class="np-time"></div>
        </div>
      </div>
      <nav class="controls" aria-label="Visualizer controls">
        <button id="btn-mic" type="button" aria-pressed="false" title="Pulse to the beat using this computer's sound, or the mic on phones (B)">Beat</button>
        <button id="btn-settings" type="button" aria-haspopup="dialog" title="Settings (S)">Settings</button>
        <button id="btn-full" type="button" title="Full screen (F)">Full screen</button>
        <button id="btn-logout" type="button" title="Disconnect Spotify">Log out</button>
      </nav>
    </div>

    <aside id="upnext" class="upnext" aria-live="polite" hidden>
      <img id="upnext-art" alt="" width="48" height="48" />
      <div class="upnext-text">
        <div class="upnext-label">Up next</div>
        <div id="upnext-title" class="upnext-title"></div>
        <div id="upnext-artist" class="upnext-artist"></div>
      </div>
    </aside>

    <div id="progress" class="progress" hidden><div id="progress-fill" class="progress-fill"></div></div>

    <dialog id="settings" class="settings" aria-labelledby="settings-title">
      <form method="dialog" class="settings-form">
        <header class="settings-head">
          <h2 id="settings-title">Settings</h2>
          <button value="close" class="small" type="submit" aria-label="Close settings">Done</button>
        </header>

        <fieldset id="style-field" hidden>
          <legend>Visual style <kbd>V</kbd></legend>
          <select id="set-style" aria-label="Visual style"></select>
        </fieldset>

        <fieldset>
          <legend>Effects</legend>
          <label class="range-row">Strength
            <input id="set-strength" type="range" min="0" max="150" step="10" />
            <output id="out-strength"></output>
          </label>
          <label class="check-row"><input id="set-reduced" type="checkbox" /> Reduced motion (slower, fewer particles, no flashes)</label>
        </fieldset>

        <fieldset>
          <legend>Lyrics</legend>
          <label class="check-row"><input id="set-lyrics" type="checkbox" /> Show lyrics <kbd>L</kbd></label>
          <label class="range-row">Size
            <select id="set-lyric-size">
              <option value="s">Small</option>
              <option value="m">Medium</option>
              <option value="l">Large</option>
            </select>
          </label>
          <label class="range-row">Timing
            <input id="set-offset" type="range" min="-3000" max="3000" step="100" />
            <output id="out-offset"></output>
          </label>
          <button id="set-offset-reset" class="small" type="button">Reset timing</button>
        </fieldset>

        <fieldset>
          <legend>Beat sync <kbd>B</kbd></legend>
          <div class="seg" role="group" aria-label="Beat sync source">
            <button id="beat-off" type="button" aria-pressed="true">Off</button>
            <button id="beat-system" type="button" aria-pressed="false">Computer sound</button>
            <button id="beat-mic" type="button" aria-pressed="false">Microphone</button>
          </div>
          <label class="range-row">Sensitivity
            <input id="set-sensitivity" type="range" min="0" max="100" step="5" />
            <output id="out-sensitivity"></output>
          </label>
          <p class="fine-print">Computer sound works in Chrome or Edge on a computer: share your screen and tick "Also share system audio". Only the sound is used.</p>
        </fieldset>

        <fieldset>
          <legend>Extras</legend>
          <label class="check-row"><input id="set-upnext" type="checkbox" /> Show "Up next" at the end of songs</label>
        </fieldset>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
